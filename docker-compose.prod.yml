version: '3.8'

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
    restart: unless-stopped

  nginx-proxy-acme:
    image: nginxproxy/acme-companion
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=praverbajaj1609@gmail.com
    depends_on:
      - nginx-proxy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      NODE_ENV: production
      VIRTUAL_HOST: syncsketch.praverbajaj.tech
      LETSENCRYPT_HOST: syncsketch.praverbajaj.tech
      LETSENCRYPT_EMAIL: praverbajaj1609@gmail.com
    depends_on:
      - backend
      - websocket
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://neondb_owner:npg_QXqhgmUW03Yy@ep-steep-resonance-a8mbwlbv-pooler.eastus2.azure.neon.tech/neondb?sslmode=require&channel_binding=require"
      VIRTUAL_HOST: api.syncsketch.praverbajaj.tech
      VIRTUAL_PORT: 3009
      LETSENCRYPT_HOST: api.syncsketch.praverbajaj.tech
      LETSENCRYPT_EMAIL: praverbajaj1609@gmail.com
    restart: unless-stopped

  websocket:
    build:
      context: .
      dockerfile: apps/websocket/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://neondb_owner:npg_QXqhgmUW03Yy@ep-steep-resonance-a8mbwlbv-pooler.eastus2.azure.neon.tech/neondb?sslmode=require&channel_binding=require"
      VIRTUAL_HOST: ws.syncsketch.praverbajaj.tech
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: ws.syncsketch.praverbajaj.tech
      LETSENCRYPT_EMAIL: praverbajaj1609@gmail.com
    restart: unless-stopped

volumes:
  nginx-certs:
  nginx-vhost:
  nginx-html:
  acme: