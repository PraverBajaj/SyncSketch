version: '3.8'

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
    restart: unless-stopped
    mem_limit: 128m

  nginx-proxy-acme:
    image: nginxproxy/acme-companion
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=praver@example.com
    depends_on:
      - nginx-proxy
    restart: unless-stopped
    mem_limit: 64m

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      NODE_ENV: production
      VIRTUAL_HOST: syncsketch.praverbajaj.tech
      LETSENCRYPT_HOST: syncsketch.praverbajaj.tech
      LETSENCRYPT_EMAIL: praver@example.com
    depends_on:
      - backend
      - websocket
    restart: unless-stopped
    mem_limit: 512m

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: "your-neon-database-url-here"
      VIRTUAL_HOST: api.syncsketch.praverbajaj.tech
      VIRTUAL_PORT: 3009
      LETSENCRYPT_HOST: api.syncsketch.praverbajaj.tech
      LETSENCRYPT_EMAIL: praver@example.com
    restart: unless-stopped
    mem_limit: 256m

  websocket:
    build:
      context: .
      dockerfile: apps/websocket/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: "your-neon-database-url-here"
      VIRTUAL_HOST: ws.syncsketch.praverbajaj.tech
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: ws.syncsketch.praverbajaj.tech
      LETSENCRYPT_EMAIL: praver@example.com
    restart: unless-stopped
    mem_limit: 256m

volumes:
  nginx-certs:
  nginx-vhost:
  nginx-html:
  acme: