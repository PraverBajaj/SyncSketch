version: '3.8'
services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages:/app/packages
    command: ["pnpm", "dev"]
    depends_on:
      - backend
      - websocket
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3009:3009"
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://neondb_owner:npg_QXqhgmUW03Yy@ep-steep-resonance-a8mbwlbv-pooler.eastus2.azure.neon.tech/neondb?sslmode=require&channel_binding=require"
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages:/app/packages
    command: ["npx", "ts-node", "src/index.ts"]
  websocket:
    build:
      context: .
      dockerfile: apps/websocket/Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://neondb_owner:npg_QXqhgmUW03Yy@ep-steep-resonance-a8mbwlbv-pooler.eastus2.azure.neon.tech/neondb?sslmode=require&channel_binding=require"
    volumes:
      - ./apps/websocket:/app/apps/websocket
      - ./packages:/app/packages
    command: ["npx", "ts-node", "src/index.ts"]
